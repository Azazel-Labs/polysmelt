name: CI

# Formatting, clippy across the feature sets Hoard and wasm builds use, the tests (with the
# conformance corpus, whose GLBs go through the Khronos validator), and the minimum Rust
# version the README promises.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - --no-default-features --features minimal
          - --no-default-features --features obj
          - --no-default-features --features ply
          - --no-default-features --features stl
          - --no-default-features --features gltf
          - --no-default-features --features draco
          - --no-default-features --features webp
          - --no-default-features --features skp
          - --no-default-features --features fbx
          - --no-default-features --features bvh
          - --no-default-features --features dae
          - --no-default-features --features x3d
          - --no-default-features --features off
          - --no-default-features --features dxf
          - --no-default-features --features 3mf
          - --no-default-features --features usd
          - --no-default-features --features tga
          - --no-default-features --features bmp
          - --no-default-features --features gif
          - --no-default-features --features tiff
          - --no-default-features --features psd
          - --no-default-features --features dds
          - --no-default-features --features splat
          - --no-default-features --features spz
          - --no-default-features --features mmd
          - --no-default-features --features directx
          - --no-default-features --features md2
          - --no-default-features --features md3
          - --no-default-features --features md5
          - --no-default-features --features iqm
          - --no-default-features --features smd
          - --no-default-features --features ms3d
          - --no-default-features --features b3d
          - --no-default-features --features asf
          - --no-default-features --features c3d
          - --no-default-features --features trc
          - --no-default-features --features htr
          - --no-default-features --features las
          - --no-default-features --features laz
          - --no-default-features --features pcd
          - --no-default-features --features xyz
          - --no-default-features --features e57
          - --no-default-features --features amf
          - --no-default-features --features lwo
          - --no-default-features --features ac3d
          - --no-default-features --features ogre
          - --no-default-features --features flt
          - --no-default-features --features ogex
          - --no-default-features --features irr
          - --no-default-features --features xgl
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # Every GLB the conformance tests wrote must pass the Khronos validator.
      - run: npm ci --prefix tools/validate
      - run: node tools/validate/validate.mjs target/tmp/conformance
      - run: cargo test --no-default-features --features minimal

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features stl,ply,obj,gltf,draco,vox,3ds,webp,skp,bvh,off,dxf,fbx,3mf,dae,x3d,tga,bmp,gif,tiff,psd,dds,splat,spz,mmd,directx,md2,md3,md5,iqm,smd,ms3d,b3d,asf,c3d,trc,htr,las,laz,pcd,xyz,e57,amf,lwo,ac3d,ogre,flt,ogex,irr,xgl -- -D warnings

  # Every dependency is Rust: nothing compiles C or links a native library. The `-sys` crates allowed are
  # declarations of what the platform already has, with no build of their own.
  pure-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: No C compilers, build tools or native libraries among the dependencies
        run: |
          cargo tree -e normal,build --prefix none --target all --all-features | sed 's/ .*//' | sort -u > deps.txt
          if grep -E -x 'cc|cmake|bindgen|pkg-config|vcpkg|nasm-rs|autotools|link-cplusplus|cxx|cxx-build' deps.txt; then
            echo "a dependency builds native code"; exit 1
          fi
          if grep -E -- '-sys$' deps.txt | grep -v -E -x 'windows-sys|js-sys|web-sys|linux-raw-sys'; then
            echo "a dependency links a native library"; exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.96"
            features: ""
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} check --all-targets ${{ matrix.features }}
