name: evidence setup
description: Restores the evidence corpora and downloads the built binaries into bin/
runs:
  using: composite
  steps:
    - uses: ./.github/actions/corpora-key
    - uses: actions/cache/restore@v4
      with:
        path: ~/corpora
        key: ${{ env.CORPORA_KEY }}
        fail-on-cache-miss: true
    - uses: actions/download-artifact@v4
      with:
        name: bin
        path: bin
    - shell: bash
      run: |
        chmod +x bin/corpus bin/parity bin/files bin/resilience bin/polysmelt-bench bin/profiling/corpus
        bin/corpus info
