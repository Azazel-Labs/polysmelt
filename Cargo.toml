[package]
name = "polysmelt"
version = "0.16.1"
edition = "2024"
# MIT-0, except the SketchUp reader (src/formats/skp), which is MIT: see its LICENSE-openskp.
license = "MIT-0 AND MIT"
# 1.88 for edition 2024's let chains (and `zip` 9). The `usd` feature, on by default, needs
# 1.96 because `openusd` 0.8 does; CI checks both.
rust-version = "1.88"
description = "Pure-Rust 3D asset interchange: glTF/GLB reading and writing, meshopt compression, and readers for common mesh formats, SketchUp included"
keywords = ["gltf", "glb", "meshopt", "3d", "mesh"]
categories = ["graphics", "game-development", "parser-implementations", "encoding"]
repository = "https://github.com/Azazel-Labs/polysmelt"
readme = "README.md"
# One crate on crates.io: the library alone. The corpus, its tools and the benchmarks stay in the repository.
include = ["/src", "/examples", "/README.md", "/LICENSE", "/Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["minimal", "fbx", "3mf", "usd", "draco", "webp", "skp", "dae", "x3d", "tga", "bmp", "gif", "tiff", "psd", "dds", "spz", "laz", "e57", "amf"]
# The readers with no dependencies, and file access: `default-features = false, features = ["minimal"]`.
minimal = ["fs", "stl", "ply", "vox", "obj", "3ds", "gltf", "bvh", "off", "dxf", "splat", "mmd", "directx", "md2", "md3", "md5", "iqm", "smd", "ms3d", "b3d", "asf", "c3d", "trc", "htr", "las", "pcd", "xyz", "lwo", "ac3d", "ogre", "flt", "ogex", "irr", "xgl"]
# Reading from the file system: `formats::load`, `assets::Folder` and `gltf::files_in`. Without
# it (for wasm, say), models load from memory with `formats::load_bytes` and `assets::Memory`.
fs = []
stl = []
ply = []
vox = []
obj = []
3ds = []
gltf = []
# BVH motion capture: a skeleton and its motion, no mesh.
bvh = []
# OFF (Object File Format), ASCII and binary.
off = []
# DXF meshes: 3D faces, polyface and polygon meshes, and MESH entities, with blocks.
dxf = []
# MikuMikuDance models (PMX 2.0 and 2.1, PMD) and motions (VMD).
mmd = []
# DirectX `.x` models: text, binary and compressed, with frames, skins and animation sets.
directx = []
# Quake II `.md2` models, their frames as morph targets.
md2 = []
# Quake III `.md3` models: surfaces, tags and frames.
md3 = []
# Doom 3 `.md5mesh` skeletal models and `.md5anim` animations.
md5 = []
# Inter-Quake Model `.iqm`: meshes, joints and animations.
iqm = []
# OGRE meshes and skeletons, binary (`.mesh`, `.skeleton`) and XML (`.mesh.xml`, `.skeleton.xml`), with
# their `.material` scripts.
ogre = []
# Valve `.smd` reference and animation files, and `.vta` vertex animation.
smd = []
# MilkShape 3D `.ms3d` models, skinned and animated.
ms3d = []
# Blitz3D `.b3d` models: nodes, meshes, bones, keys and brushes.
b3d = []
# Acclaim `.asf` skeletons and `.amc` motions.
asf = []
# C3D motion capture: markers as animated points.
c3d = []
# TRC marker motion capture.
trc = []
# HTR (Hierarchical Translation-Rotation) motion capture.
htr = []
# Gaussian splats in the 32-byte `.splat` layout (KHR_gaussian_splatting).
splat = []
# Gaussian splats in gzipped `.spz`, versions 1 to 3 (KHR_gaussian_splatting).
spz = ["dep:flate2"]
fbx =["dep:base64", "dep:flate2"]
3mf = ["dep:zip", "dep:quick-xml"]
# COLLADA `.dae`, and `.zae` and `.kmz` archives holding one.
dae = ["dep:zip", "dep:quick-xml"]
usd = ["dep:openusd", "dep:openusd-schemas", "dep:zip"]
# Draco-compressed glTF meshes (KHR_draco_mesh_compression).
draco = ["gltf", "dep:draco-core"]
# WebP textures (`EXT_texture_webp`, or a `.webp` file a model names) re-encoded as PNG for
# the flat mesh, which embeds only PNG and JPEG.
webp = ["dep:image-webp", "dep:flate2", "dep:fdeflate"]
# Texture formats glTF can't embed, decoded and re-encoded as PNG the same way: TGA, BMP, a GIF's
# first frame, TIFF, a PSD's merged image, and DDS (BC1 to BC5, or uncompressed).
tga = ["dep:flate2", "dep:fdeflate"]
bmp = ["dep:flate2", "dep:fdeflate"]
gif = ["dep:flate2", "dep:fdeflate"]
tiff = ["dep:flate2", "dep:fdeflate"]
psd = ["dep:flate2", "dep:fdeflate"]
dds = ["dep:flate2", "dep:fdeflate"]
# SketchUp `.skp`, from SketchUp 3 to the latest, converted through glTF.
skp = ["gltf", "dep:flate2", "dep:fdeflate"]
# X3D and VRML97 meshes: classic (`.wrl`, `.x3dv`), XML (`.x3d`) and gzipped (`.wrz`, `.x3dz`).
x3d = ["dep:quick-xml", "dep:flate2"]
# LAS lidar point clouds, versions 1.0 to 1.4, point formats 0 to 10.
las = []
# LAZ, compressed LAS.
laz = ["las", "dep:laz"]
# PCD point clouds (ascii, binary and binary_compressed).
pcd = []
# Text point clouds: `.xyz`, `.pts`, `.ptx` and `.asc`.
xyz = []
# E57 scans: point clouds with their poses, colors and intensity.
e57 = ["dep:e57"]
# AMF (Additive Manufacturing File), plain or zipped.
amf = ["dep:quick-xml", "dep:zip", "dep:base64", "dep:flate2", "dep:fdeflate"]
# LightWave objects (`.lwo`: LWOB, LWO2 and LWO3).
lwo = []
# AC3D `.ac` models.
ac3d = []
# OpenFlight `.flt` databases, with their SGI image textures.
flt = []
# OpenGEX `.ogex` scenes.
ogex = []
# Irrlicht scenes (`.irr`) and meshes (`.irrmesh`).
irr = []
# XGL and zipped XGL (`.xgl`, `.zgl`).
xgl = []

[dependencies]
serde_json = "1"
# Typed vertex data viewed as the bytes a GLB stores, without copying (unsafe is forbidden here).
bytemuck = "1"
thiserror = "2"
# Shared, sliceable bytes: images in a mesh point at the buffer they were read into rather than copying it.
bytes = { version = "1.10", default-features = false }
base64 = { version = "0.22", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.41", optional = true }
openusd = { version = "0.8", optional = true }
openusd-schemas = { version = "0.8", features = ["geom", "shade"], optional = true }
image-webp = { version = "0.2", optional = true }
# zip already brings flate2 on the zlib-rs backend; PNG checksums and reads share it. Runtime detection lets inflate use
# the CPU's wider instructions (FBX arrays are mostly zlib).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs", "runtime_detection"], optional = true }
# The PNG writer's deflate: made for filtered rows, and much faster than flate2 at its fastest.
fdeflate = { version = "0.3.7", optional = true }
laz = { version = "0.14", default-features = false, optional = true }
e57 = { version = "0.11", default-features = false, optional = true }
draco-core = { version = "2.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"], optional = true }

[dev-dependencies]
# The FBX reader's tests check its tree against this independent reader, and write FBX with it.
fbxcel = { version = "0.9", features = ["tree", "writer"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
# The glTF reader downstream tools render with: decompressed and decoded output must load in it
# (`extras` for custom `_ATTRIBUTES`, as Farthing reads them).
gltf = { version = "1.4", default-features = false, features = ["allow_empty_texture", "extras", "utils"] }

[[example]]
name = "meshopt"
required-features = ["fs"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numbers are most of what a mesh library does, and handedness, units and transforms go wrong
# quietly. Pedantic already flags every lossy `as` cast and every `==` on floats; these add
# float comparison against constants, float literals that can't be represented, and spellings
# that lose precision (`(x * x + y * y).sqrt()` rather than `x.hypot(y)`).
float_cmp_const = "warn"
lossy_float_literal = "warn"
imprecise_flops = "warn"
# `suboptimal_flops` (rewrite `a * b + c` as `mul_add`) stays off: it changes results bit for
# bit, and without an FMA instruction (baseline x86-64, wasm) `mul_add` is a slow library call.
# Single letters (`x`, `y`, `z`, `u`, `v`, `r`, `g`, `b`) are the math's own names.
many_single_char_names = "allow"
similar_names = "allow"
# Readers are long matches over a format's records; splitting them hides the format's shape.
too_many_lines = "allow"
# A style suggestion (`as_chunks`) for fixed-size `chunks_exact`; the codec loops stay as
# written, matching meshoptimizer's structure.
chunks_exact_to_as_chunks = "allow"
